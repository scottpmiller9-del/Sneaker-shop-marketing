[build]
  publish = "."

# Short links to the plan
[[redirects]]
  from = "/plan"
  to = "/sneaker-shop-marketing-plan/"
  status = 301

[[redirects]]
  from = "/marketing-plan"
  to = "/sneaker-shop-marketing-plan/"
  status = 301

# Force the apex domain once it is attached
[[redirects]]
  from = "https://www.sneakershopmarketing.com/*"
  to = "https://sneakershopmarketing.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/assets/logos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
